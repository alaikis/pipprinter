version: "1.0"
name: 流水线-202611140444
displayName: PipPrinter 发布流水线（tag 触发自动发版）
triggers:
  trigger: auto
  push:
    tags:
      prefix:
        - v
stages:
  - name: build
    displayName: 构建 .NET 10 单文件 Release 包
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@dotnet
        name: build_dotnet
        displayName: .NET 10 编译
        dotnetVersion: '10.0'
        commands:
          - '# tag 触发时 GITEE_BRANCH 即 tag 名（如 v1.00.001），去 v 前缀得到版本号'
          - VERSION=${GITEE_BRANCH#v}
          - '[ -z "$VERSION" ] && VERSION="1.00.001"'
          - echo "Building PipPrinter v${VERSION} for win-x64 (self-contained single file)"
          - '# 制品名统一用 ${GITEE_BRANCH}（含 v 前缀），与 release 阶段 assertFiles 一致'
          - PKG=PipPrinter-win-x64-${GITEE_BRANCH}.zip
          - dotnet restore
          - dotnet build -c Release -p:Version=${VERSION} -p:EnableWindowsTargeting=true
          - dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${VERSION} -p:EnableWindowsTargeting=true -o ./release/publish
          - mkdir -p ./out
          - (cd ./release/publish && zip -r ../../out/${PKG} .)
          - '# 生成自动更新清单 latest.json（版本号去 v 前缀；printf 必须单行，避免 YAML 折叠块注入空格）'
          - SHA=$(shasum -a 256 ./out/${PKG} | awk '{print $1}')
          - SIZE=$(wc -c < ./out/${PKG})
          - printf '{"version":"%s","url":"https://gitee.com/alaikiscom/pipprinter/releases/download/%s/%s","sha256":"%s","size":%s,"notes":"PipPrinter %s (win-x64)","publishedAt":"%s"}' "${VERSION}" "${GITEE_BRANCH}" "${PKG}" "${SHA}" "${SIZE}" "${VERSION}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ./out/latest.json
          - cat ./out/latest.json
        artifacts:
          - name: PIPPRINTER_RELEASE
            path:
              - ./out/
        caches:
          - ~/.nuget/packages
        notify: []
        strategy:
          retry: '0'
  - name: release
    displayName: 发布 Gitee Release
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: release@gitee
        name: release_gitee
        displayName: Gitee Release
        releaseName: ${GITEE_BRANCH}
        description: PipPrinter ${GITEE_BRANCH} (win-x64)
        tagName: ${GITEE_BRANCH}
        upstreamArtifact:
          - PIPPRINTER_RELEASE
        assertFiles:
          - PipPrinter-win-x64-${GITEE_BRANCH}.zip
          - latest.json
        prerelease: false
        allowUpdate: true
        notify: []
        strategy:
          retry: '0'
