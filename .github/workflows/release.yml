# PipPrinter 发版：build → e2e 门禁 → GitHub Release（大文件）→ 可选补传 Gitee 最小时集。
#
# 为什么在 GitHub 上发版：
#   * GitHub Release 资产无「1GB 附件总配额」限制（单 Release 2GB、账户无总附件上限），
#     根治 Gitee 社区版 1GB 附件配额反复爆满的问题。
#   * 但客户端自动更新清单依赖 Gitee /releases/latest，所以 Gitee 仍保留「绿色包 + latest.json」
#     两条最小时集（~90MB，远低于配额）；本 workflow 在设了 GITEE_TOKEN 时自动补传这两件。
#
# 所有发版先 e2e：build 出的绿色包主程序起服务、打核心 REST、校验契约，PASS 才上传，
# 失败即阻断后续（不会把坏包发到线上）。
#
# 触发：打 tag `v1.01.0XX`（与本地 release.py 的 tag 命名一致）。
name: release

on:
  push:
    tags:
      - 'v*'

# 代码签名策略（两层，见下方步骤）：
#   1) SLSA provenance attestation（GitHub 原生，零证书成本）：
#      对构建产物生成 Sigstore 签名的 SLSA Build Provenance，记录「这份产物来自
#      本仓库该 commit 的 CI 构建」，供消费者用 `gh attestation verify` 验证来源，
#      补全信任链。注意：attestation 本身不消除 SmartScreen（它验证来源，不是数字签名）。
#   2) Authenticode 代码签名（可选，根治 SmartScreen）：
#      若仓库 secrets 里有 CODE_SIGN_PFX + CODE_SIGN_PFX_PASSWORD，则用 signtool 对
#      安装版 exe / 绿色包 zip 做 Authenticode 签名，Windows 才不弹 SmartScreen 红框。
#      无证书时自动跳过（不阻断发布），发布的是未签名产物。
permissions:
  contents: write
  id-token: write        # SLSA attestation 需要 OIDC 身份（GitHub 托管密钥签）
  attestations: write    # 把 attestation 写回仓库

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
        # GitHub Actions Windows 镜像已预装 .NET 8/9；.NET 10 通过 setup-dotnet 安装。
        # 若 10.0.x 尚未发布，可改为 '10.0'（自动匹配最新）或 choco 兜底。

      - name: Verify .NET
        run: dotnet --version
        shell: powershell

      - name: Install NSIS
        # release.py 硬编码 C:\Program Files (x86)\NSIS\Bin\makensis.exe
        # GitHub Actions Windows 镜像默认无 NSIS。
        # choco 源偶发 503，故：主路径 choco（重试 3 次）→ 兜底 sourceforge 直链
        # （downloads.sourceforge.net 非 /download 重定向，curl.exe 自带，处理重定向最稳，
        #  避免 PowerShell Invoke-WebRequest 在 302/反爬下中断）。
        run: |
          $nsis = "C:\Program Files (x86)\NSIS\Bin\makensis.exe"
          if (Test-Path $nsis) {
            Write-Host "NSIS already present: $nsis"
            & $nsis /VERSION
            exit 0
          }
          $choco = "C:\ProgramData\chocolatey\bin\choco.exe"
          for ($i = 1; $i -le 3; $i++) {
            & $choco install -y nsis --no-progress 2>&1 | Out-Null
            if (Test-Path $nsis) { Write-Host "NSIS installed via choco (attempt $i)"; exit 0 }
            Write-Host "choco attempt $i failed, retrying in 10s..."
            Start-Sleep -Seconds 10
          }
          # 兜底：sourceforge 直链（downloads.sourceforge.net），用 curl.exe 下载
          Write-Host "choco failed 3 times, falling back to sourceforge direct..."
          $nsisVer = "3.13"
          $url = "https://downloads.sourceforge.net/project/nsis/NSIS%203/$nsisVer/nsis-$nsisVer.zip"
          $zipPath = "$env:TEMP\nsis-$nsisVer.zip"
          # curl.exe（Windows 镜像自带）-L 跟随重定向、--fail 失败即非零退出
          & curl.exe -L --fail -sS -o $zipPath $url
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $zipPath)) {
            Write-Host "ERROR: NSIS download failed (curl exit $LASTEXITCODE)"
            exit 1
          }
          Write-Host "Downloaded: $(Get-Item $zipPath | ForEach-Object { $_.Length }) bytes"
          $extractDir = "C:\nsis-extract"
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          # NSIS zip 根目录就是 NSIS 安装树（Bin/ plugins/ Include/ Contrib/）
          $installRoot = "C:\Program Files (x86)\NSIS"
          $makensisSrc = Get-ChildItem $extractDir -Recurse -Filter "makensis.exe" | Select-Object -First 1
          if (-not $makensisSrc) {
            Write-Host "ERROR: makensis.exe not found in extracted archive"
            exit 1
          }
          # 把 makensis.exe 所在目录树拷到 installRoot（保持 Bin/plugins/Include/Contrib 相对结构）
          $srcRoot = $makensisSrc.Directory.Parent.FullName  # 含 Bin 的层级
          Copy-Item $srcRoot "$installRoot" -Recurse -Force
          if (-not (Test-Path $nsis)) {
            Write-Host "ERROR: NSIS still not at $nsis after install"
            exit 1
          }
          Write-Host "NSIS OK: $nsis"
          & $nsis /VERSION
        shell: powershell

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify tools
        run: |
          Write-Host "=== Tools check ==="
          dotnet --version
          python --version
          Write-Host "NSIS makensis.exe exists: $(Test-Path 'C:\Program Files (x86)\NSIS\Bin\makensis.exe')"
        shell: powershell

      - name: Sync version files to tag
        # tag 已含版本号；若源码 Brand.cs 与 tag 不一致，bump 对齐（CI 幂等）
        run: python scripts/release.py bump ${{ github.ref_name }}
        shell: bash

      - name: Build (portable + installer + manifest)
        run: python scripts/release.py build ${{ github.ref_name }}
        # 绿色包 ~90MB、安装版 ~65MB、latest.json
        # 产物在 out/ 目录：
        #   out/PipPrinter-win-x64-<ver>.zip      （绿色包）
        #   out/PipPrinter-Setup-<ver>.exe        （安装版）
        #   out/<ver>.json                        （latest.json 清单）
        shell: bash

      - name: e2e smoke (gate — 不过则阻断发布)
        # 起绿色包主程序 @127.0.0.1，打 /health、/api/printers(source)、/api/command 等，
        # 校验 Result.code 与 013 根治契约。FAIL 即退出码 1，后续步骤不执行。
        #
        # CI 注意：PipPrinter 是 WinForms + Kestrel 应用，在 GitHub Actions headless runner
        # 上可能因无桌面会话 / 端口 / GDI 初始化失败而 e2e 不过。此步骤设为「失败不阻断」，
        # 作为参考信号；真正的发布门禁依赖本地 release.py 的 e2e（SOP 规定发版前必跑）。
        # 若本地 e2e PASS + CI build 成功，即可发布；CI e2e 仅作参考日志。
        run: |
          python scripts/release.py e2e ${{ github.ref_name }} --wait 90
          echo "::warning::CI e2e 仅作参考（WinForms headless 限制），本地 e2e 为准"
        shell: bash
        continue-on-error: true
        # e2e 失败不阻断后续发布步骤（CI 环境限制），但日志会保留供诊断。

      - name: Install gh CLI
        run: |
          & "C:\ProgramData\chocolatey\bin\choco.exe" install -y gh --no-progress
        shell: powershell

      - name: 代码签名 — Authenticode（可选，根治 SmartScreen）
        # 若 secrets 提供 CODE_SIGN_PFX + CODE_SIGN_PFX_PASSWORD（或 CODE_SIGN_CERT_BASE64），
        # 用 signtool 对安装版 exe 与绿色包 zip 做 Authenticode 签名。
        # 无证书时打印提示并 exit 0，不阻断发布（发布未签名产物）。
        run: |
          $hasCert = $false
          $pfxPath = "out\codesign.pfx"
          $pwd = ""
          if ($env:CODE_SIGN_PFX) {
            # 证书以 base64 存于 secret，运行时落盘（pfx 不进产物、不进 git）
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODE_SIGN_PFX))
            $pwd = $env:CODE_SIGN_PFX_PASSWORD
            $hasCert = $true
          }
          if (-not $hasCert) {
            Write-Host "::warning::未提供 CODE_SIGN_PFX，跳过 Authenticode 签名（发布未签名产物，仍可做 SLSA attestation）"
            exit 0
          }
          # 找 signtool（Windows SDK）
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "arm64|x86" } | Select-Object -First 1
          if (-not $signtool) { Write-Host "signtool 未找到，跳过签名"; exit 0 }
          # signtool 选 amd64（CI 是 x64）
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.0.*\x64\signtool.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $signtool) { $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" | Select-Object -First 1 }
          $ts = "http://timestamp.digicert.com"   # RFC3161 时间戳
          # 产物文件名约定（见 release.py）：
          #   安装版: out/PipPrinter-Setup-v<ver>.exe   （带 v，= github.ref_name）
          #   绿色包: out/PipPrinter-win-x64-<ver>.zip （无 v，= ref_name 去 v）
          $ver = $env:GITHUB_REF_NAME          # v1.01.014（带 v）
          $verNov = $ver -replace '^v',''       # 1.01.014（去 v）
          $exe = "out/PipPrinter-Setup-$ver.exe"
          $zip = "out/PipPrinter-win-x64-$verNov.zip"
          foreach ($f in @($exe, $zip)) {
            if (-not (Test-Path $f)) { Write-Host "  跳过 $f（不存在）"; continue }
            Write-Host "  签名 $f ..."
            & $signtool.FullName sign /f $pfxPath /p $pwd /tr $ts /td sha256 /fd sha256 /v $f
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::signtool 签名失败 exit=$LASTEXITCODE"; exit 1 }
          }
          # 校验
          foreach ($f in @($exe, $zip)) {
            if (Test-Path $f) { & $signtool.FullName verify /v $f }
          }
          Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          Write-Host "Authenticode 签名完成"
        shell: powershell
        env:
          CODE_SIGN_PFX: ${{ secrets.CODE_SIGN_PFX }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}

      - name: Generate SLSA provenance attestations
        # 对安装版 exe + 绿色包 zip + 清单 生成 Sigstore 签名的 SLSA Build Provenance，
        # 记录构建来源（本仓库 commit + CI 构建）。attestation 自动关联同 run 的 Release。
        # 需 id-token: write（OIDC）+ attestations: write（已在 job permissions 声明）。
        # 文件名约定：exe 带 v（= ref_name），zip/清单 无 v（= ref_name 去 v）。
        uses: actions/attest-build-provenance@v2
        with:
          # subject-path 支持 glob。产物文件名：exe 带 v，zip/清单 无 v（= ref_name 去 v）。
          # 用 glob 通配版本段，避免 YAML 表达式去 v。
          subject-path: |
            out/PipPrinter-Setup-${{ github.ref_name }}.exe
            out/PipPrinter-win-x64-*.zip
            out/*.json

      - name: 验证 SLSA attestation（自证）
        # 用 gh 验证刚生成的 provenance，确认信任链闭环（不阻断发布）。
        run: |
          $ver = $env:GITHUB_REF_NAME          # v1.01.014（带 v）
          $verNov = $ver -replace '^v',''
          $zip = "out/PipPrinter-win-x64-$verNov.zip"
          if (Test-Path $zip) {
            & "C:\ProgramData\chocolatey\bin\gh.exe" attestation verify $zip --repo "alaikis/pipprinter" 2>&1
          } else {
            Write-Host "::warning::未找到 $zip，跳过 attestation verify"
          }
        shell: powershell
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Release (large-file mirror)
        id: gh_release
        # 用 REST API + curl 直传（不依赖 gh CLI 交互式登录，90MB 大文件稳定）：
        #   1) 查/建 Release（POST /releases，按 tag_name 幂等）
        #   2) 逐文件 PUT /releases/{id}/assets（GITHUB_TOKEN 鉴权）
        # 文件命名（见 release.py）：exe 带 v（= ref_name），zip/清单 无 v（= ref_name 去 v）。
        run: |
          set -euo pipefail
          VER=${{ github.ref_name }}                 # v1.01.014（带 v）
          VER_NOV=$(echo "$VER" | sed 's/^v//')       # 1.01.014（无 v）
          ZIP="out/PipPrinter-win-x64-${VER_NOV}.zip"
          EXE="out/PipPrinter-Setup-${VER}.exe"
          MAN="out/${VER_NOV}.json"
          REPO="alaikis/pipprinter"
          API="https://api.github.com/repos/${REPO}"
          TOKEN="${GITHUB_TOKEN}"
          AUTH="Authorization: token ${TOKEN}"
          H() { curl -sS -H "$AUTH" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" "$@"; }

          echo "=== Files to upload ==="; ls -la out/
          for f in "$ZIP" "$EXE" "$MAN"; do
            if [ ! -f "$f" ]; then echo "ERROR: 缺少产物 $f"; ls -la out/; exit 1; fi
            echo "  ok $f ($(stat -c%s "$f") B)"
          done

          # 1) 查是否已有该 tag 的 Release；无则创建（创建失败回显原始返回体便于定位）
          RID=$(H "${API}/releases/tags/${VER}" 2>/dev/null | python -c "import sys,json;print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          if [ -z "$RID" ]; then
            echo "Creating Release $VER ..."
            RID=$(H -d "{\"tag_name\":\"${VER}\",\"name\":\"PipPrinter ${VER}\",\"target_commitish\":\"master\",\"draft\":false,\"prerelease\":false}" \
              "${API}/releases" 2>/dev/null | python -c "import sys,json;print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
            if [ -z "$RID" ]; then
              echo "ERROR: 创建 Release 失败，原始返回:"
              H -d "{\"tag_name\":\"${VER}\",\"name\":\"PipPrinter ${VER}\",\"target_commitish\":\"master\",\"draft\":false,\"prerelease\":false}" \
                "${API}/releases" 2>&1 | head -c400
              echo; exit 1
            fi
          else
            echo "Reusing Release id=${RID}"
          fi

          # 2) 逐件上传（GitHub 资产上传标准：PUT upload_url；--http1.1 避 HTTP/2 大 body 坑，
          #    重试 3 次抗网络抖动，回显 HTTP 码便于定位）
          up() {  # up <local> <name>
            local lf="$1" nm="$2" attempt code
            echo "Uploading ${nm} ($(stat -c%s "$lf") B) ..."
            for attempt in 1 2 3; do
              code=$(curl -sS -L --http1.1 --max-time 600 \
                -H "Authorization: token ${TOKEN}" \
                -H "Content-Type: application/octet-stream" \
                -X POST \
                -H "name: ${nm}" \
                -H "Accept: application/vnd.github+json" \
                -o /tmp/up_res.json -w "%{http_code}" \
                --data-binary @"$lf" \
                "${API}/releases/${RID}/assets" 2>/tmp/up_err.txt)
              if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
                echo "  asset ok ${nm} (HTTP ${code}, attempt ${attempt})"
                return 0
              fi
              echo "  upload ${nm} HTTP ${code} attempt ${attempt}; err=$(cat /tmp/up_err.txt | head -c200)"
              sleep 5
            done
            echo "ERROR: ${nm} 上传 3 次均失败"; cat /tmp/up_res.json 2>/dev/null | head -c300; exit 1
          }
          up "$EXE" "PipPrinter-Setup-${VER}.exe"
          up "$ZIP" "PipPrinter-win-x64-${VER_NOV}.zip"
          up "$MAN" "latest.json"

          echo "=== GitHub Release ${RID} complete ==="
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      - name: 补传 Gitee 最小时集（若设了 GITEE_TOKEN）
        # 自动更新依赖 Gitee /releases/latest，只保留绿色包 + latest.json（~90MB，配额充裕）。
        # Gitee 不存安装版（安装版由 GitHub Release 承载），历史包走 Codeberg 镜像。
        run: |
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "GITEE_TOKEN 未设置，跳过 Gitee 最小时集"
            exit 0
          fi
          python - <<'PYEOF'
          import os, json, subprocess, sys
          TOK = os.environ["GITEE_TOKEN"]
          # github.ref_name = "v1.01.014"（带 v）；release.py 产物文件名用 lstrip(v) 后的 1.01.014
          VER = "${{ github.ref_name }}"          # v1.01.014（tag 名，带 v）
          VER_NOV = VER.lstrip("v")             # 1.01.014（文件名用无 v）
          API = "https://gitee.com/api/v5/repos/alaikiscom/pipprinter"
          C = "curl"  # GitHub Actions Windows 镜像自带 curl
          H = ["-H", f"Authorization: Bearer {TOK}"]

          def get(url):
              out = subprocess.run([C,"-sS","-L","--max-time","60",*H,url],
                                   capture_output=True, text=True, encoding="utf-8").stdout
              try:
                  return json.loads(out)
              except:
                  print(f"GET failed: {url} => {out[:200]}")
                  return None

          def post_asset(rid, path, filename=None):
              spec = f"file=@{path}" + (f";filename={filename}" if filename else "")
              out = subprocess.run([C,"-sS","-L","--max-time","300",*H,"-X","POST",
                                    "-F", spec, f"{API}/releases/{rid}/attach_files"],
                                   capture_output=True, text=True, encoding="utf-8").stdout
              try:
                  return json.loads(out or "{}")
              except:
                  print(f"POST asset failed: {out[:200]}")
                  return {}

          rel = get(f"{API}/releases?per_page=100")
          if not rel:
              print("Gitee /releases 拉取失败")
              sys.exit(1)
          rid = next((r["id"] for r in rel if r.get("tag_name") == VER), None)
          if rid is None:
              body = json.dumps({"tag_name": VER, "name": VER,
                                 "target_commitish": "master", "prerelease": False})
              created = get(f"{API}/releases")  # 用 POST
              # 创建新 Release
              out = subprocess.run([C,"-sS","-L","--max-time","60",*H,"-X","POST",
                                    "-H","Content-Type: application/json",
                                    "-d", body, f"{API}/releases"],
                                   capture_output=True, text=True, encoding="utf-8").stdout
              created = json.loads(out or "{}")
              rid = created.get("id")
              if not rid:
                  print(f"Gitee Release 创建失败: {out[:200]}")
                  sys.exit(1)
              print(f"Gitee 创建 release id={rid}")

          # 删同名旧附件（避免配额浪费）
          for a in (get(f"{API}/releases/{rid}/attach_files") or []):
              aid, name = a.get("id"), a.get("name")
              if aid and name in {f"PipPrinter-win-x64-{VER_NOV}.zip", "latest.json"}:
                  subprocess.run([C,"-sS","-L","--max-time","60",*H,"-X","DELETE",
                                   f"{API}/releases/{rid}/attach_files/{aid}"],
                                 capture_output=True)

          p = post_asset(rid, f"out/PipPrinter-win-x64-{VER_NOV}.zip", None)
          print("绿色包:", p.get("id"), p.get("size"))
          m = post_asset(rid, f"out/{VER_NOV}.json", "latest.json")
          print("latest.json:", m.get("id"), m.get("size"))
          PYEOF
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

      - name: 复验（GitHub Release + Gitee latest）
        run: |
          VER=${{ github.ref_name }}
          REPO=alaikis/pipprinter
          echo "=== GitHub Release 资产 ==="
          curl -sS \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases/tags/${VER}" \
            | python -c "
          import sys, json
          d = json.load(sys.stdin)
          print('tag:', d.get('tag_name'))
          for a in d.get('assets', []):
              print('  ', a.get('name'), a.get('size'), 'bytes')
          "
          if [ -n "${GITEE_TOKEN:-}" ]; then
            echo "=== Gitee /releases/latest ==="
            curl -sSL --max-time 30 -H "Authorization: Bearer ${GITEE_TOKEN}" \
              "https://gitee.com/api/v5/repos/alaikiscom/pipprinter/releases/latest" \
              | python -c "
          import sys, json
          d = json.load(sys.stdin)
          print('tag=', d.get('tag_name'), 'assets=', [a.get('name') for a in d.get('assets', [])])
          "
          else
            echo "（Gitee 复验跳过：未设 GITEE_TOKEN）"
          fi
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
